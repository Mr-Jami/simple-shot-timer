<html lang="en">

<style>
  body { margin: 0; padding: 40px; background: #333; }

  .og-brand svg { width: 40px; height: 40px; color: #fff; }
  .og-title { margin-top: 36px; font-size: 96px; line-height: 0.94; letter-spacing: -0.036em; font-weight: 700; }
  .og-sub { margin-top: 26px; font-size: 28px; line-height: 1.3; letter-spacing: -0.02em; color: #a1a1a6; }
  .og-sub b { color: #fee036; font-weight: 600; }
  .og-phone { position: absolute; left: 760px; top: 52px; }
  .og-phone .phone { --pw: 330; }
</style>

<div id="og">

  <div class="og-glow"></div>
  <div class="og-copy">
    <div class="og-brand"><svg><use href="#mark"/></svg>Simple Shot Timer</div>
    <div class="og-title" data-de="Beep. Ziehen.<br>Split.">Beep. Draw.<br>Split.</div>

          <div class="fin-bottom">
            <div class="stats">
              <div class="stat"><span class="l" data-de="SCHÜSSE">SHOTS</span><span class="v">5</span></div>

              <div class="stat"><span class="l">SPLIT</span><span class="v">0.22s</span></div>

</div>

<script type="module">
  import { drawHalftone } from '/src/halftone.js';
  const c = document.querySelector('#og canvas');
  // ?lang=de renders public/og-de.png.
  if (new URLSearchParams(location.search).get('lang') === 'de') {
    document.documentElement.lang = 'de';
    document.querySelectorAll('[data-de]').forEach((el) => { el.innerHTML = el.dataset.de; });
  }
  await document.fonts.ready;
  drawHalftone(c, 0.5);
</script>
