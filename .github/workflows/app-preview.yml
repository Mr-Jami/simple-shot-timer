name: App preview

# Records the raw material of the App Store preview video: the real app in
# an iPhone simulator, played by integration_test/app_preview.dart, with
# the simulator's screen recorded. The recording is an artifact of the
# run; branding/store-listing/README.md says how it becomes the video.
# Nothing is uploaded to the store from here.
on:
  pull_request:
    branches: [main]
    paths:
      - 'integration_test/app_preview.dart'
      - '.github/workflows/app-preview.yml'
  workflow_dispatch:

concurrency:
  group: app-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record in the simulator
    runs-on: macos-15
    timeout-minutes: 45

    env:
      FLUTTER_VERSION: '3.41.9'
      # The Xcode the App Store build uses (deploy-app-store.yml).
      XCODE_VERSION: '26.3'
      BUNDLE_ID: cc.jami.simpleshottimer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build for the simulator
        # With the script as the app's entry point: started like any app,
        # it plays the story by itself.
        run: >-
          flutter build ios --simulator --debug
          --target integration_test/app_preview.dart

      - name: Boot an iPhone
        # The largest iPhone with a Dynamic Island that is installed, on
        # the newest iOS it is installed for: the App Store takes one
        # preview size (886x1920) for every current iPhone.
        run: |
          xcrun simctl list devices available
          for name in 'iPhone 17 Pro Max' 'iPhone 16 Pro Max' 'iPhone 15 Pro Max'; do
            device=$(xcrun simctl list devices available \
              | grep -E "^ +$name \(" | tail -1 \
              | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}' || true)
            if [ -n "$device" ]; then
              break
            fi
          done
          if [ -z "$device" ]; then
            echo "::error::no Pro Max iPhone simulator on this runner"
            exit 1
          fi
          echo "Recording on $name ($device)"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark
          # Apple's own screenshots: 9:41, full signal, full battery.
          xcrun simctl status_bar "$device" override \
            --time '9:41' \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState discharging --batteryLevel 100
          xcrun simctl install "$device" build/ios/iphonesimulator/Runner.app
          # The script never opens the microphone, but no system dialog may
          # ever cover the app.
          xcrun simctl privacy "$device" grant microphone "$BUNDLE_ID" || true

      - name: Wait for the simulator to come to rest
        # After its first boot a simulator is busy for minutes (indexing,
        # setting itself up), and a recording made meanwhile loses frames
        # by the second. Until the Mac's load is back under its three
        # cores, eight minutes at most.
        run: |
          sleep 30
          for _ in $(seq 1 45); do
            load=$(sysctl -n vm.loadavg | awk '{ print $2 }')
            echo "load $load"
            if awk -v load="$load" 'BEGIN { exit !(load < 3) }'; then
              break
            fi
            sleep 10
          done

      - name: Record the app
        run: |
          mkdir -p preview

          sysctl -n vm.loadavg
          # What the app prints, for when the script fails.
          xcrun simctl spawn "$DEVICE" log stream --style compact \
            --predicate 'processImagePath ENDSWITH "/Runner"' \
            > preview/app.log 2>&1 &
          logger=$!

          xcrun simctl io "$DEVICE" recordVideo --codec=h264 --mask=ignored \
            --force preview/recording.mov 2> preview/recording.log &
          recorder=$!
          for _ in $(seq 1 150); do
            if grep -q 'Recording started' preview/recording.log; then
              break
            fi
            sleep 0.2
          done
          cat preview/recording.log
          sleep 2

          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          # The script writes its steps here; a simulator's files are the
          # Mac's.
          marks="$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE_ID" data)/Documents/app_preview_marks.txt"
          result='did not finish in time'
          for _ in $(seq 1 300); do
            if grep -q 'PREVIEW_MARK end' "$marks" 2> /dev/null; then
              result=passed
              break
            fi
            if grep -q 'PREVIEW_MARK failed' "$marks" 2> /dev/null; then
              result=failed
              break
            fi
            sleep 1
          done

          sleep 2
          # SIGINT, or the file is left without its index.
          kill -INT "$recorder"
          wait "$recorder" || true
          kill "$logger" || true
          xcrun simctl terminate "$DEVICE" "$BUNDLE_ID" || true
          cat preview/recording.log
          cp "$marks" preview/marks.txt || true
          cat preview/marks.txt
          ls -l preview
          if [ "$result" != passed ]; then
            echo "::error::the preview script $result (see app.log in the artifact)"
            grep -a 'flutter' preview/app.log | tail -n 120 || true
            exit 1
          fi

      - name: Upload the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-preview-recording
          path: preview/
          if-no-files-found: error
          retention-days: 14
