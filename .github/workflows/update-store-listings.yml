name: Update store listings

# Uploads the listing text in fastlane/metadata (see its README) to Google
# Play and App Store Connect, in every language that has a folder there, and
# the App Store's What's New, built from the GitHub Releases. Text only:
# binaries, screenshots, graphics and the Play "What's new" (which
# deploy-play-store.yml sets from the GitHub Release) are left alone.

on:
  workflow_dispatch:
    inputs:
      store:
        description: 'Which store listings to update'
        type: choice
        options:
          - both
          - google-play
          - app-store
        default: both
      app_store_version:
        description: 'App Store version to edit or create (empty: the version in pubspec.yaml)'
        required: false
        default: ''
      whats_new:
        description: 'App Store: write What''s New from the GitHub Releases (off: keep what App Store Connect has)'
        type: boolean
        default: true
      validate_only:
        description: 'Save nothing: validate the Google Play listings and show the App Store What''s New'
        type: boolean
        default: false

concurrency:
  group: store-listings
  cancel-in-progress: false

env:
  # The listings are UTF-8 (umlauts, Cyrillic); fastlane needs a UTF-8 locale.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: '1'
  FASTLANE_HIDE_CHANGELOG: '1'
  FASTLANE_OPT_OUT_USAGE: '1'

jobs:
  google-play:
    name: Google Play listings
    if: inputs.store != 'app-store'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload listings
        # Updates the main store listing (title, short and full description)
        # in each language under fastlane/metadata/android, creating the
        # translation if Play doesn't have it yet. Languages without a folder
        # are not touched. Google reviews listing changes before they go live.
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          fastlane run upload_to_play_store \
            package_name:cc.jami.simpleshottimer \
            metadata_path:fastlane/metadata/android \
            skip_upload_apk:true \
            skip_upload_aab:true \
            skip_upload_changelogs:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            validate_only:${{ inputs.validate_only }}

  app-store:
    name: App Store listings
    if: inputs.store != 'google-play'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        env:
          VERSION_INPUT: ${{ inputs.app_store_version }}
        run: |
          VERSION="${VERSION_INPUT:-$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)}"
          if [ -z "$VERSION" ]; then
            echo "::error title=App Store listings::No version given and none found in pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Write What's New
        # The App Store gets the same text as the Play "What's new": the
        # GitHub Releases rewritten by play_release_notes.py, in English for
        # every language. An App Store update can skip versions, so it covers
        # every release after the version live on the App Store (read from
        # Apple's public lookup API) up to the one being prepared. With
        # whats_new off no release_notes.txt is written, and App Store
        # Connect keeps its text.
        if: inputs.whats_new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # True when $1 <= $2 in version order.
          le() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }

          LIVE=$(curl -fsS "https://itunes.apple.com/lookup?bundleId=cc.jami.simpleshottimer&country=us" \
            | jq -r '.results[0].version // empty') || LIVE=""
          if [ -z "$LIVE" ]; then
            echo "::warning title=App Store What's New::Couldn't read the live App Store version; using the v$VERSION release only"
          elif le "$VERSION" "$LIVE"; then
            echo "::warning title=App Store What's New::$VERSION is not newer than the live $LIVE; using the v$VERSION release only"
            LIVE=""
          fi

          : > "$RUNNER_TEMP/releases.md"
          for v in $(gh release list --limit 100 --json tagName --jq '.[].tagName' \
                     | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p' | sort -rV); do
            le "$v" "$VERSION" || continue
            if [ -n "$LIVE" ] && le "$v" "$LIVE"; then break; fi
            echo "Including v$v"
            gh release view "v$v" --json body --jq .body >> "$RUNNER_TEMP/releases.md"
            echo >> "$RUNNER_TEMP/releases.md"
            [ -n "$LIVE" ] || break
          done

          python3 .github/scripts/play_release_notes.py --max-chars 4000 --store "App Store" \
            < "$RUNNER_TEMP/releases.md" > "$RUNNER_TEMP/whats_new.txt"
          for dir in fastlane/metadata/ios/*/; do
            cp "$RUNNER_TEMP/whats_new.txt" "${dir}release_notes.txt"
          done
          echo "--- What's New for $VERSION (live: ${LIVE:-not used}) ---"
          cat "$RUNNER_TEMP/whats_new.txt"

      - name: Set up Ruby
        if: ${{ !inputs.validate_only }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        if: ${{ !inputs.validate_only }}
        run: gem install fastlane --no-document

      - name: Write App Store Connect API key
        # fastlane reads the team API key from a JSON file; jq escapes the
        # multi-line .p8 contents.
        if: ${{ !inputs.validate_only }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          jq -n \
            --arg key_id "$API_KEY_ID" \
            --arg issuer_id "$API_ISSUER_ID" \
            --arg key "$API_KEY" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > "$RUNNER_TEMP/asc_api_key.json"

      - name: Upload listings
        # Edits the version that is being prepared for submission (creating
        # it if needed): name, subtitle and privacy URL on the app, and
        # description, promotional text, keywords, What's New, support and
        # marketing URL on the version, in each language under
        # fastlane/metadata/ios. Nothing is
        # submitted for review, and fields without a file (the English
        # keywords) keep their current value. deliver runs precheck after the
        # upload even without a submission, and precheck fails with an API
        # key, so it is switched off.
        if: ${{ !inputs.validate_only }}
        run: |
          echo "Editing App Store version $VERSION"
          fastlane run upload_to_app_store \
            api_key_path:"$RUNNER_TEMP/asc_api_key.json" \
            app_identifier:cc.jami.simpleshottimer \
            app_version:"$VERSION" \
            metadata_path:fastlane/metadata/ios \
            skip_binary_upload:true \
            skip_screenshots:true \
            submit_for_review:false \
            run_precheck_before_submit:false \
            force:true

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc_api_key.json"
