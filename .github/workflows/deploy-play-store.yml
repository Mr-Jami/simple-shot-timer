name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (internal, alpha, beta, production)'
        required: true
        default: 'internal'

jobs:
  deploy:
    name: Build & Publish Android App Bundle
    runs-on: ubuntu-latest

    env:
      # The F-Droid recipe reads this line to pick its Flutter version; keep the format.
      FLUTTER_VERSION: '3.41.9'
      JAVA_VERSION: '17'
      PACKAGE_NAME: cc.jami.simpleshottimer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed App Bundle
        # --build-number overrides the Android versionCode. Using
        # github.run_number gives us a monotonically increasing integer per
        # workflow run, which Play Store requires for every upload. The
        # versionName (e.g. 1.2.3) still comes from pubspec.yaml, which
        # release-please manages on its release PR.
        # --obfuscate and --split-debug-info make the Dart code about 1.2 MB
        # smaller; its stack traces then need the symbols kept below
        # (flutter symbolize -i <trace> -d app.android-arm64.symbols).
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info="$PWD/build/symbols" \
            --extra-gen-snapshot-options=--save-obfuscation-map="$PWD/build/symbols/obfuscation-map.json"

      - name: Keep the Dart symbols
        # Named by the build number Play Console shows for the upload.
        uses: actions/upload-artifact@v4
        with:
          name: dart-symbols-android-build-${{ github.run_number }}
          path: build/symbols
          if-no-files-found: error
          # A re-run uploads the same name again.
          overwrite: true
          # The most GitHub keeps an artifact of a public repository.
          retention-days: 90

      - name: Prepare Play Store release notes
        # Pull the body of the GitHub Release for the current tag (or the
        # latest release when triggered manually) and turn it into plain-text
        # "What's new" notes: user-facing sections only, no links, commit
        # hashes or scopes, capped at Play Store's 500 chars per locale. The
        # GitHub Release itself is left untouched. Falls back to a generic
        # "Bug fixes and improvements." when gh can't read the release, the
        # body is empty or has no user-facing sections; each case logs a
        # warning annotation explaining why.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p distribution/whatsnew
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v*.*.* ]]; then
            NOTES=$(gh release view "$TAG" --json body --jq .body) \
              || echo "::warning title=Play Store release notes::gh release view $TAG failed (see error above)"
          else
            NOTES=$(gh release view --json body --jq .body) \
              || echo "::warning title=Play Store release notes::gh release view (latest) failed (see error above)"
          fi
          printf '%s' "$NOTES" \
            | python3 .github/scripts/play_release_notes.py --max-chars 500 \
            > distribution/whatsnew/whatsnew-en-US
          echo "--- whatsnew-en-US ---"
          cat distribution/whatsnew/whatsnew-en-US

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Upload App Bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
