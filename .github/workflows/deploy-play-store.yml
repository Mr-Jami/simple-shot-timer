name: Deploy to Google Play

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track (internal, alpha, beta, production)'
        required: true
        default: 'internal'

jobs:
  deploy:
    name: Build & Publish Android App Bundle
    runs-on: ubuntu-latest

    env:
      FLUTTER_VERSION: '3.41.9'
      JAVA_VERSION: '17'
      PACKAGE_NAME: cc.jami.simpleshottimer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed App Bundle
        # --build-number overrides the Android versionCode. Using
        # github.run_number gives us a monotonically increasing integer per
        # workflow run, which Play Store requires for every upload. The
        # versionName (e.g. 1.2.3) still comes from pubspec.yaml, which
        # release-please manages on its release PR.
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Prepare Play Store release notes
        # Pull the body of the GitHub Release for the current tag (or the
        # latest release when triggered manually) into the whatsnew file the
        # upload action reads. Play Store caps each locale at 500 chars, so we
        # truncate. Falls back to a generic message if no release exists yet.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p distribution/whatsnew
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == v*.*.* ]]; then
            NOTES=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo "")
          else
            NOTES=$(gh release view --json body --jq .body 2>/dev/null || echo "")
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Bug fixes and improvements."
          fi
          # Strip markdown heading markers (#, ##, ###...) so '### Features'
          # renders as 'Features' in Play Store, which doesn't parse markdown.
          NOTES=$(printf '%s' "$NOTES" | sed -E 's/^#{1,6}[[:space:]]+//')
          printf '%s' "$NOTES" | head -c 500 > distribution/whatsnew/whatsnew-en-US
          echo "--- whatsnew-en-US ---"
          cat distribution/whatsnew/whatsnew-en-US

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

      - name: Upload App Bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
