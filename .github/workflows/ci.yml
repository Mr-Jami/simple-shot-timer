name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch the Material fonts
        # Some widget tests measure text in Roboto from the SDK's cache
        # (bin/cache/artifacts/material_fonts), which flutter test alone
        # never downloads.
        run: flutter precache --universal

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
