name: simple_shot_timer
description: A simple shot timer Flutter application.
publish_to: 'none'
homepage: https://jami-it.de
repository: https://github.com/Mr-Jami/simple-shot-timer
issue_tracker: https://github.com/Mr-Jami/simple-shot-timer/issues

version: 2.3.2+15

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Audio capture (mic) and playback (beep)
  record: ^5.1.2
  audioplayers: ^6.1.0

  # Device features
  wakelock_plus: ^1.2.8
  vibration: ^2.0.0
  permission_handler: ^11.3.1
  share_plus: ^9.0.0

  # Formatting
  intl: ^0.20.2

  # App metadata (version number for the credits line)
  package_info_plus: ^9.0.0

  # Keeps the app alive while the timer is running, so users can lock the
  # screen or switch apps mid-string without losing detection or beeps.
  flutter_foreground_task: ^9.1.0

  # Opens the privacy policy from Settings (App Store guideline 5.1.1).
  url_launcher: ^6.3.3
  video_player: ^2.11.1
  image_picker: ^1.2.4
  # Saves an exported video to the phone's videos. 2.3.3: the newest that
  # builds with Flutter 3.41.
  gal: 2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks in integration_test/ (not run in CI).
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.3.5

# Pin transitive plugins whose released versions are incompatible with the
# current record_platform_interface (1.5.0). They are only built when those
# platforms are targeted, but Flutter still type-checks them.
dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/branding/
    # Section-7 license terms, shown on the in-app licenses page.
    - NOTICE
    # The video overlay's badge font and its licence (OFL), also shown there.
    - assets/fonts/Montserrat-OFL.txt

  fonts:
    # Basic Latin only (pyftsubset U+0020-007E): the badge is the one user.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-ExtraBoldItalic.ttf
          weight: 800
          style: italic
