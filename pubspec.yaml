name: simple_shot_timer
description: A simple shot timer Flutter application.
publish_to: 'none'

version: 1.4.1+6

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Audio capture (mic) and playback (beep)
  record: ^5.1.2
  audioplayers: ^6.1.0

  # Device features
  wakelock_plus: ^1.2.8
  vibration: ^2.0.0
  permission_handler: ^11.3.1
  share_plus: ^9.0.0

  # Formatting
  intl: ^0.20.2

  # App metadata (version number for the credits line)
  package_info_plus: ^9.0.0

  # Keeps the app alive while the timer is running, so users can lock the
  # screen or switch apps mid-string without losing detection or beeps.
  flutter_foreground_task: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pin transitive plugins whose released versions are incompatible with the
# current record_platform_interface (1.5.0). They are only built when those
# platforms are targeted, but Flutter still type-checks them.
dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/branding/
