# Draft F-Droid metadata for Simple Shot Timer. It goes into a fork of
# https://gitlab.com/fdroid/fdroiddata as metadata/cc.jami.simpleshottimer.yml
# (see fdroid.md next to this file). Summary, description, icon, screenshots
# and changelogs come from fastlane/metadata/android in this repository.
Categories:
  - Clock
  - Sports & Health
License: GPL-3.0-only
AuthorName: Tareq Jami
AuthorEmail: info@jami-it.de
AuthorWebSite: https://jami-it.de/
WebSite: https://simpleshottimer.com/
SourceCode: https://github.com/Mr-Jami/simple-shot-timer
IssueTracker: https://github.com/Mr-Jami/simple-shot-timer/issues
Changelog: https://github.com/Mr-Jami/simple-shot-timer/blob/main/CHANGELOG.md

AutoName: Simple Shot Timer

RepoType: git
Repo: https://github.com/Mr-Jami/simple-shot-timer.git

Builds:
  - versionName: 2.3.1
    versionCode: 14
    commit: ee8b89147b423657bce256c8a8c9bac21770b444
    output: build/app/outputs/apk/release/app-release-unsigned.apk
    srclibs:
      - flutter@3.41.9
    rm:
      - branding
      - graphify-out
      - ios
      - website
    prebuild:
      # v2.3.1 still signs a key-less release build with the debug key; from
      # the next tag on the release build is unsigned without key.properties
      # and this line can go (it is a no-op there).
      - sed -i -e 's/signingConfigs.getByName("debug")/null/' android/app/build.gradle.kts
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release
    ndk: r28c

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 2.3.1
CurrentVersionCode: 14
